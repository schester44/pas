name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Throwaway values; nothing here is a real secret.
    env:
      NODE_ENV: test
      LOG_LEVEL: warn
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pas
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://localhost:4000
      ADMIN_ORIGIN: http://localhost:5173
      APP_ORIGIN: http://localhost:5174
      API_PORT: "4000"
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: .storage

    steps:
      - uses: actions/checkout@v5

      # Version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @pas/db exec prisma migrate deploy

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm fmt:check
      - run: pnpm test
      - run: pnpm build
